name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "dev", "feat/*" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    - cron: '24 16 * * 5'

jobs:
  analyze:
    name: Analyze
    if: github.repository == 'jaab-tech/fluxrig' && !contains(github.repository, 'internal')
    # A GitHub-hosted runner: this job runs only in the public repository, where
    # hosted runners are free. The self-hosted runner does not serve this
    # repository, and it must not run code from a fork pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Manual, so the analysed build is exactly `go build ./...`. Autobuild
        # runs `make` first, whose default target starts with the linter.
        build-mode: "manual"

    - name: Build
      run: go build ./...

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
