meta:
  name: Getting Started
  version: v1.0.0

# This scenario demonstrates a complete message flow through the fluxrig topology.
# A generator gear produces synthetic telemetry data every 2 seconds, sends it
# through a wire to a sink gear, which logs the received messages to the console.

gears:
  - name: generator
    type: bento
    config:
      ports:
        outputs: ["out"]
      bento:
        input:
          generate:
            mapping: |
              root.flux_id = uuid_v4()
              root.timestamp = now()
              root.status = "UP"
              root.metrics.cpu_pct = random_int(min:10, max:85)
              root.metrics.mem_mb = random_int(min:512, max:4096)
              root.message = "Hello from fluxrig Getting Started!"
            interval: 2s
        # Output auto-wired via port "out"

  - name: sink
    type: bento
    config:
      ports:
        inputs: ["in"]
      bento:
        # Input auto-wired via port "in"
        output:
          stdout: {}

wires:
  - from: generator.out
    to: sink.in
