# A server that sends a logon as soon as a client connects.
#
#   client --> server_io    (the connection opens)
#              server_io ~~> on_connect --> encode --> server_io --> client
#
# The client sends nothing first. io_iso8583 publishes a durable event when a
# connection opens, and the on_connect gear reads it through ports.events. That
# gear has no wire in front of it. Each event gives one message, with the conn.id
# of the connection in its metadata, so the message reaches that connection when
# it is wired to the in port of server_io.
#
# The event survives a pause. If the Mixer or the reader is away for a moment,
# the logon leaves when it returns. An event older than max_event_age is dropped,
# because the terminal may have gone, so after a long outage a client that
# connected gets no logon. A client mode gear publishes the same events.
#
# Run it from the repository root (the spec path below is relative to it).

meta:
  name: "iso8583_server_logon"
  version: "1.0.0"

gears:
  - name: "server_io"
    type: "io_iso8583"
    config:
      mode: "server"
      bind: ":8888"
      frame_length_size: 2
      frame_length_endian: "big"
      encoding: "ascii"
      strict_connection_routing: true
      idle_timeout: "5m"

  - name: "on_connect"
    type: "bento"
    config:
      ports:
        outputs: ["out"]
        events:
          - gear: "server_io"
            on: ["opened"]
            max_event_age: "30s"
      bento:
        pipeline:
          processors:
            # DE 7 is the transmission date and time, MMDDhhmmss in UTC. DE 11
            # (STAN) counts from 1 to 999999 and wraps. The counter lives in
            # memory, so it starts at 1 again when the Rack restarts. DE 70 001
            # is a sign-on.
            - mapping: |
                meta "iso8583.mti" = "0800"
                root = {"iso8583": {"field": {
                  "7": now().ts_format("0102150405", "UTC"),
                  "11": "%06d".format(counter(min: 1, max: 999999)),
                  "70": "001"
                }}}

  - name: "encode"
    type: "codec_iso8583"
    config:
      spec_path: "examples/specs/iso8583-v87-ascii.yaml"
      direction: "encode"
      on_error: "reject"

wires:
  - from: "on_connect.out"
    to: "encode.in"
  - from: "encode.out"
    to: "server_io.in"
