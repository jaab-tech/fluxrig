# BCD-dominant spec with per-field encoding overrides
# Numeric fields use BCD encoding.
# Alpha fields override to ASCII encoding.
spec:
  id: bcd-basic
  name: bcd-basic
  version: 1.0.0
  wire:
    format: moov
    fields:
      0:
        type: String
        length: 4
        enc: BCD
        prefix: BCD.Fixed
        padding:
          pad: "0"
          type: Left
        description: MTI
      1:
        type: Bitmap
        length: 8
        enc: Binary
        prefix: Binary.Fixed
        description: Bitmap
      2:
        type: String
        length: 19
        enc: BCD
        prefix: BCD.LL
        padding:
          pad: "0"
          type: Left
        description: PAN
      3:
        type: String
        length: 6
        enc: BCD
        prefix: BCD.Fixed
        padding:
          pad: "0"
          type: Left
        description: Processing Code
      4:
        type: String
        length: 12
        enc: BCD
        prefix: BCD.Fixed
        padding:
          pad: "0"
          type: Left
        description: Amount
      11:
        type: String
        length: 6
        enc: BCD
        prefix: BCD.Fixed
        padding:
          pad: "0"
          type: Left
        description: STAN
      12:
        type: String
        length: 6
        enc: BCD
        prefix: BCD.Fixed
        padding:
          pad: "0"
          type: Left
        description: Local Time
      13:
        type: String
        length: 4
        enc: BCD
        prefix: BCD.Fixed
        padding:
          pad: "0"
          type: Left
        description: Local Date
      25:
        type: String
        length: 2
        enc: BCD
        prefix: BCD.Fixed
        padding:
          pad: "0"
          type: Left
        description: POS Condition Code
      37:
        type: String
        length: 12
        enc: ASCII
        prefix: ASCII.Fixed
        description: Retrieval Reference Number
      38:
        type: String
        length: 6
        enc: ASCII
        prefix: ASCII.Fixed
        description: Authorization ID
      39:
        type: String
        length: 2
        enc: ASCII
        prefix: ASCII.Fixed
        description: Response Code
      41:
        type: String
        length: 8
        enc: ASCII
        prefix: ASCII.Fixed
        description: Terminal ID
      42:
        type: String
        length: 15
        enc: ASCII
        prefix: ASCII.Fixed
        description: Merchant ID
      49:
        type: String
        length: 3
        enc: ASCII
        prefix: ASCII.Fixed
        description: Currency Code
  fields:
    0:
      name: MTI
    1:
      name: Bitmap
    2:
      name: PAN
      alias: card.pan
      log_mask: true
    3:
      name: Processing Code
      alias: proc_code
    4:
      name: Amount
      alias: amount
    11:
      name: STAN
      alias: stan
    12:
      name: Local Time
      alias: local_time
    13:
      name: Local Date
      alias: local_date
    25:
      name: POS Condition Code
      alias: pos_condition
    37:
      name: Retrieval Reference Number
      alias: rrn
    38:
      name: Authorization ID
      alias: auth_id
    39:
      name: Response Code
      alias: response_code
    41:
      name: Terminal ID
      alias: terminal_id
    42:
      name: Merchant ID
      alias: merchant_id
    49:
      name: Currency Code
      alias: currency
