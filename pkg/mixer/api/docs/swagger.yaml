basePath: /api/v1
definitions:
  api.ActionResponse:
    properties:
      name:
        description: Name of the rack (for import/approve).
        example: rack-01
        type: string
      status:
        description: Status of the action.
        example: activated
        type: string
    type: object
  api.ApproveRequest:
    properties:
      name:
        description: Name to assign to the rack (optional, defaults to current).
        example: rack-prod-01
        type: string
    type: object
  api.HealthResponse:
    properties:
      entity_id:
        description: EntityID is the unique fluxEntityID of this Mixer.
        example: 019de49b-0000-7000-8000-000000000000
        type: string
      lease:
        allOf:
        - $ref: '#/definitions/api.LeaseStatus'
        description: |-
          Lease reports the write lease of a Mixer cluster. Absent when the lease
          is off (a single Mixer).
      machine_id:
        description: MachineID is the persistent machine ID.
        example: 019de49b-0000-7000-8000-000000000000
        type: string
      status:
        description: Status of the service (e.g. "ok").
        example: ok
        type: string
      version:
        description: Version of the service.
        example: 0.1.0
        type: string
    type: object
  api.LeaseStatus:
    properties:
      error:
        description: |-
          Error is "unavailable" when the lease could not be read. The raw cause
          is not returned because /health does not require authentication.
        type: string
      held:
        description: Held is true when this Mixer holds the lease and may write.
        example: false
        type: boolean
      holder:
        description: |-
          Holder is the machine_id of the Mixer that holds the lease. Absent when
          no Mixer holds it: control writes answer 503 until one does.
        example: 019de49b-0000-7000-8000-000000000000
        type: string
      holder_since:
        description: HolderSince is when the holder took the lease.
        type: string
      renewed:
        description: Renewed is the holder's last successful renew.
        type: string
    type: object
  api.RackResponse:
    properties:
      config:
        allOf:
        - $ref: '#/definitions/config.RackConfig'
        description: Config (Runtime).
      first_seen:
        description: FirstSeen timestamp.
        example: "2023-10-26T10:00:00Z"
        type: string
      id:
        description: ID is the entity ID of the rack.
        example: "45612378"
        type: string
      ip:
        description: IP address of the Rack.
        example: 192.168.1.50
        type: string
      last_seen:
        description: LastSeen timestamp.
        example: "2023-10-27T10:00:00Z"
        type: string
      machine_id:
        description: MachineID is the physical machine ID.
        example: 019de49b-0000-7000-8000-000000000000
        type: string
      name:
        description: Name of the rack.
        example: rack-01
        type: string
      port:
        description: Port the Rack listens on.
        example: 4222
        type: integer
      stats:
        allOf:
        - $ref: '#/definitions/api.RackStats'
        description: Stats (Transient/Snapshot).
      status:
        description: Status of the rack (active, inactive, pending).
        example: active
        type: string
    type: object
  api.RackStats:
    properties:
      cpu_usage:
        description: CPU usage percentage.
        example: 12.5
        type: number
      load_avg:
        description: Load average (1m).
        example: 0.5
        type: number
      mem_usage:
        description: Memory usage percentage.
        example: 45.2
        type: number
      uptime:
        description: Uptime in seconds.
        example: 3600
        type: integer
    type: object
  api.ScenarioImportResponse:
    properties:
      name:
        description: Name of the imported scenario.
        example: payment-switch-v1
        type: string
      status:
        description: Status of the import.
        example: imported_and_activated
        type: string
    type: object
  api.SimControlArgs:
    properties:
      from:
        type: number
      gear:
        type: string
      over:
        type: string
      seed:
        type: integer
      shape:
        type: string
      to:
        type: number
      tps:
        type: number
    type: object
  api.SpecSummary:
    properties:
      doc:
        description: Doc is where this version's protocol reference is served.
        example: /api/v1/specs/iso8583-v87-ascii/v3.0.0/doc
        type: string
      hash:
        example: 1c8831d23bdd8458feafe6a506c5d3730605b78fd22b5d5c7f1c147043ef71af
        type: string
      imported_at:
        description: ImportedAt is absent for anything filed before the store kept
          dates.
        example: "2026-09-06T18:47:26Z"
        type: string
      latest:
        description: Latest reports whether a reference without a tag resolves here.
        example: true
        type: boolean
      name:
        example: iso8583-v87-ascii
        type: string
      protocol:
        description: |-
          Protocol is what the spec declares it speaks; empty when it declares none
          and relies on the loader's default.
        example: iso8583
        type: string
      size:
        description: Size of the stored document in bytes.
        example: 34441
        type: integer
      tag:
        example: v3.0.0
        type: string
      title:
        description: |-
          Title is the human name the document declares, which is not the reference
          it is filed under.
        example: ISO 8583:1987 (ASCII)
        type: string
      urn:
        example: iso8583-v87-ascii:v3.0.0
        type: string
    type: object
  api.SpecUploaded:
    properties:
      hash:
        example: 5dd8f432c33bc7a61f4cd49c8933e34a94f5586f60b878e99cdb51314ef6eacb
        type: string
      kind:
        description: |-
          Kind is what the Mixer validated the artefact as: iso8583, iso20022,
          translation, or data (lookup records, which have no spec header).
        example: translation
        type: string
      name:
        example: billpay-rtp
        type: string
      tag:
        example: v1.0.0
        type: string
      urn:
        example: billpay-rtp:v1.0.0
        type: string
    type: object
  api.TopologyStatusResponse:
    properties:
      active_scenario:
        description: ActiveScenario is the name of the currently active scenario.
        example: Getting Started
        type: string
      active_ver:
        description: ActiveVer is the currently active scenario version.
        example: v1.2.3
        type: string
      racks_total:
        description: RacksTotal is the total number of registered racks.
        example: 50
        type: integer
      sync_status:
        description: SyncStatus indicates global sync state.
        example: synchronized
        type: string
    type: object
  catalog.TrustedKey:
    properties:
      fingerprint:
        description: Fingerprint is the SHA-256 of the public key, in hex.
        type: string
      revoked:
        type: boolean
      vendor:
        type: string
    type: object
  catalog.WasmMetadata:
    properties:
      hash:
        type: string
      size_bytes:
        type: integer
      status:
        description: '"Trusted: VendorX" or "Untrusted"'
        type: string
    type: object
  config.ApiConfig:
    properties:
      approvalPushTimeout:
        description: |-
          ApprovalPushTimeout bounds the push of the active scenario to a Rack
          that an operator approves. The push does not end when the request
          does: a client that disconnects must not leave the Rack half served.
        example: 10s
        type: string
      authDisabledDangerously:
        description: |-
          AuthDisabledDangerously must be set explicitly to start the Mixer with
          no AuthToken configured. Without either, Start refuses to run: silently
          serving the management API unauthenticated is the exact failure mode
          this field exists to require an explicit, named opt-out from.
        example: false
        type: boolean
      controlConfirmTimeout:
        description: |-
          ControlConfirmTimeout bounds how long a control-plane command (the
          simulator start/stop/rate/reset endpoints) waits for a gear to
          acknowledge receiving it before the request answers that nobody is
          listening, rather than the success a bare, unconfirmed publish would
          have reported.
        example: 2s
        type: string
      port:
        description: Port to listen on.
        example: 8090
        type: integer
      readHeaderTimeout:
        description: ReadHeaderTimeout for the HTTP server.
        example: 3s
        type: string
      tlscertFile:
        description: TLSCertFile path to server certificate.
        example: server.crt
        type: string
      tlskeyFile:
        description: TLSKeyFile path to server key.
        example: server.key
        type: string
    type: object
  config.BaseConfig:
    properties:
      name:
        example: node-01
        type: string
      scenarioFile:
        description: ScenarioFile names, inside StateDir, the Rack's copy of the last
          scenario it applied. Empty keeps no copy.
        example: scenario.flux
        type: string
      stateDir:
        example: ./data
        type: string
      stateFile:
        example: rack.flux
        type: string
    type: object
  config.EmbeddedConfig:
    properties:
      flushInterval:
        description: FlushInterval for the embedded stack.
        example: 5s
        type: string
      retentionDays:
        description: |-
          RetentionDays for local parquet files. Wins over
          Rotation.MaxAgeDays when set to a positive value.
        example: 30
        type: integer
      rotation:
        allOf:
        - $ref: '#/definitions/config.RotationConfig'
        description: Rotation controls the retention sweep over local parquet files.
    type: object
  config.EnrollmentConfig:
    properties:
      autoAdopt:
        description: |-
          AutoAdopt, if true, will automatically mark newly enrolled Racks as 'active'.
          If false (default), new Racks start as 'pending'.
        example: false
        type: boolean
      pushDelay:
        description: PushDelay is the time to wait before pushing state to a newly
          enrolled Rack.
        example: 1s
        type: string
      pushTimeout:
        description: PushTimeout bounds the push of the active scenario that follows
          an enrollment.
        example: 10s
        type: string
    type: object
  config.IngestConfig:
    properties:
      bufferSize:
        description: BufferSize is the internal channel buffer size (deprecated).
        example: 1024
        type: integer
      flushInterval:
        description: FlushInterval determines how often to flush data to Parquet.
        example: 5s
        type: string
    type: object
  config.LoggingConfig:
    properties:
      compress:
        example: true
        type: boolean
      debug:
        description: Hard-override for debug level
        type: boolean
      filename:
        example: logs/fluxrig.log
        type: string
      level:
        example: info
        type: string
      maxBackups:
        example: 7
        type: integer
      maxSizeMB:
        example: 100
        type: integer
      throttling:
        $ref: '#/definitions/config.ThrottlingConfig'
      trace:
        description: Hard-override for trace level
        type: boolean
    type: object
  config.MetricsConfig:
    properties:
      bentoEnabled:
        type: boolean
      hostEnabled:
        type: boolean
      runtimeEnabled:
        type: boolean
    type: object
  config.MixerConfig:
    properties:
      api:
        $ref: '#/definitions/config.ApiConfig'
      base:
        $ref: '#/definitions/config.BaseConfig'
      enrollment:
        $ref: '#/definitions/config.EnrollmentConfig'
      ingest:
        $ref: '#/definitions/config.IngestConfig'
      logging:
        $ref: '#/definitions/config.LoggingConfig'
      mixer:
        $ref: '#/definitions/config.MixerSettings'
      observability:
        $ref: '#/definitions/config.ObservabilityConfig'
      registry:
        $ref: '#/definitions/config.RegistryConfig'
      snake:
        $ref: '#/definitions/config.SnakeConfig'
      store:
        $ref: '#/definitions/config.StoreConfig'
      telemetry:
        $ref: '#/definitions/config.TelemetryConfig'
      wasm:
        $ref: '#/definitions/config.WasmConfig'
    type: object
  config.MixerSettings:
    properties:
      followInterval:
        description: |-
          FollowInterval is how often a Mixer that does not hold the write lease
          checks the active-scenario pointer and reloads it when it changed.
        example: 5s
        type: string
      forwardTimeout:
        description: |-
          ForwardTimeout bounds a control write forwarded to the lease holder. It
          must cover a cross-site round trip plus the holder's own write.
        example: 5s
        type: string
      maxHops:
        description: Message Limits
        type: integer
      maxPayloadSize:
        type: integer
      queueGroup:
        description: |-
          QueueGroup, when set, makes a Mixer's subscriptions a shared durable
          queue group: exactly one member handles each message. It is turned on
          automatically with the write lease, so several Mixers do not each
          process the same Hello. Empty keeps every Mixer subscribing alone.
        example: fluxrig-mixers
        type: string
      scenarioWaitTimeout:
        description: ScenarioWaitTimeout is the time to wait for a rack to register
          when activating a scenario.
        example: 15s
        type: string
      startupScenario:
        description: StartupScenario reference to the scenario to load on startup.
        type: string
    type: object
  config.NATSStorageConfig:
    properties:
      bucket:
        example: fluxrig_telemetry
        type: string
    type: object
  config.OTLPStorageConfig:
    properties:
      cafile:
        description: CAFile verifies the collector's certificate, when a public CA
          does not.
        type: string
      endpoint:
        description: |-
          Endpoint is the collector's base URL; the paths /v1/logs, /v1/metrics
          and /v1/traces are added to it.
        example: https://collector.example:4318
        type: string
      headersFile:
        description: |-
          HeadersFile holds extra request headers, one "Name: value" per line,
          such as an authorization token.
        type: string
    type: object
  config.ObservabilityConfig:
    properties:
      embedded:
        allOf:
        - $ref: '#/definitions/config.EmbeddedConfig'
        description: Embedded configures the local embedded stack.
      enabled:
        description: Enabled master switch for observability features.
        example: true
        type: boolean
      storage:
        allOf:
        - $ref: '#/definitions/config.StorageConfig'
        description: Storage is where the Mixer keeps telemetry.
      tier:
        description: Tier selects the backend (embedded or standard).
        example: embedded
        type: string
    type: object
  config.RackConfig:
    properties:
      base:
        $ref: '#/definitions/config.BaseConfig'
      logging:
        $ref: '#/definitions/config.LoggingConfig'
      rack:
        $ref: '#/definitions/config.RackSettings'
      snake:
        $ref: '#/definitions/config.SnakeConfig'
      store:
        $ref: '#/definitions/config.StoreConfig'
      telemetry:
        $ref: '#/definitions/config.TelemetryConfig'
    type: object
  config.RackSettings:
    properties:
      cleanupTimeout:
        type: string
      convergenceTimeout:
        type: string
      drainTimeout:
        description: |-
          DrainTimeout bounds a graceful stop (SIGTERM or shutdown command). It
          must exceed the largest gear ticket TTL so in-flight work can complete
          or time out before the process exits. Default 35s (> a 30s switch TTL).
        type: string
      enrollmentInterval:
        type: string
      enrollmentTimeout:
        type: string
      handshakeInterval:
        type: string
      heartbeatInterval:
        type: string
      ip:
        example: 10.0.0.5
        type: string
      laneQueueSize:
        description: |-
          LaneQueueSize is how many messages each wire inside the Rack can hold in memory
          between the gear that emits and the gear that consumes. LaneSendTimeout is how
          long an emitting gear waits for room in a full queue before it gets an error.
        example: 1024
        type: integer
      laneSendTimeout:
        example: 5s
        type: string
      machineID:
        description: 'Runtime only: set via Passport or Mixer assignment'
        type: string
      maxHops:
        type: integer
      maxPayloadSize:
        type: integer
      namePrefix:
        type: string
      outboxBackpressureTimeout:
        description: |-
          OutboxBackpressureTimeout is how long a live emission waits for older
          parked messages on its subject to drain while the bus is up, before it
          parks behind them. With "subject" order it cannot go first, and parking
          it under load fills the outbox until the cap drops messages. "0s" parks
          at once. With the bus down nothing waits.
        example: 1s
        type: string
      outboxDrainRetries:
        description: |-
          OutboxDrainRetries is how many more times the drain tries a parked
          emission the bus refuses before it moves on and leaves it parked for
          the next drain. A refused emission is never dropped: only one the bus
          marks as invalid is.
        example: 3
        type: integer
      outboxMaxMessages:
        description: |-
          OutboxMaxMessages caps how many bus-bound emissions wait in memory
          while the bus is down. When full the oldest entry is dropped and
          counted; the emitting gear is never blocked.
        example: 10000
        type: integer
      outboxOrder:
        description: |-
          OutboxOrder is the drain order: "subject" (default) never forwards an
          emission ahead of an older one on the same subject, and "none" forwards
          whatever the bus takes as it takes it.
        example: subject
        type: string
    type: object
  config.RegistryConfig:
    properties:
      bucket:
        description: Bucket names the registry bucket.
        example: fluxrig_registry
        type: string
      leaseBucket:
        description: |-
          LeaseBucket names the bucket that holds the lease. It must differ from
          the registry and liveness buckets.
        example: fluxrig_lease
        type: string
      leaseEnabled:
        description: |-
          LeaseEnabled turns on the write lease: one Mixer holds it and does
          every control-plane write, so several Mixers never write the registry
          at once. Off by default, which keeps a single Mixer exactly as it was.
        example: false
        type: boolean
      leaseRenew:
        description: |-
          LeaseRenew is how often the holder renews. It must be well under
          LeaseTTL so an ordinary slow write does not lapse the lease.
        example: 10s
        type: string
      leaseTTL:
        description: |-
          LeaseTTL is the lease duration: the bucket's max age, and how long a
          holder may go without a successful renew before it stops writing. Sized
          against the slowest election at cross-site latency.
        example: 30s
        type: string
      livenessBucket:
        description: LivenessBucket names the presence bucket.
        example: fluxrig_liveness
        type: string
      livenessTTL:
        description: |-
          LivenessTTL is how long after its last heartbeat a Rack still counts
          as online. Three heartbeat intervals by default.
        example: 90s
        type: string
      maxValueSize:
        description: |-
          MaxValueSize is the largest record in bytes, headers included. In
          practice it bounds a scenario file.
        example: 1048576
        type: integer
      orphanMinAge:
        description: |-
          OrphanMinAge is how old a registry record must be before the sweep
          treats it as left behind rather than in progress.
        example: 5m
        type: string
      replicas:
        description: |-
          Replicas is the replica count of both buckets. A single Mixer holds one
          replica, so a value above 1 needs as many JetStream servers.
        example: 1
        type: integer
      specBucket:
        description: |-
          SpecBucket names the bucket that holds the shared spec store. It is
          used with the lease on: every Mixer of the cluster reads and imports
          specs there. A single Mixer keeps its local store.
        example: fluxrig_specs
        type: string
      specMaxSize:
        description: |-
          SpecMaxSize is the largest spec in bytes the shared store accepts. It
          is the spec bucket's max value size, so it must not exceed the Snake's
          max_payload (1 MiB by default).
        example: 1048576
        type: integer
      sweepInterval:
        description: |-
          SweepInterval is how often the Mixer repairs what a crash between two
          registry writes left behind. It also sweeps once at startup.
        example: 10m
        type: string
      writeRetries:
        description: |-
          WriteRetries is how many times a registry write that met a concurrent
          one is read again and retried before it fails.
        example: 3
        type: integer
    type: object
  config.RotationConfig:
    properties:
      checkInterval:
        description: |-
          CheckInterval is how often the retention sweep runs. The sweep
          also runs once at Mixer startup.
        example: 1h
        type: string
      maxAgeDays:
        description: |-
          MaxAgeDays deletes parquet files older than this many days when
          RetentionDays is not set to a positive value.
        example: 30
        type: integer
    type: object
  config.S3StorageConfig:
    properties:
      accessKeyFile:
        description: |-
          AccessKeyFile and SecretKeyFile hold the credentials. Empty reads
          AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
        type: string
      bucket:
        example: fluxrig-telemetry
        type: string
      cafile:
        description: CAFile verifies the service's certificate, when a public CA does
          not.
        type: string
      endpoint:
        description: Endpoint is the host and port of the service, without a scheme.
        example: s3.amazonaws.com
        type: string
      plaintext:
        description: Plaintext talks HTTP instead of HTTPS. Development only.
        example: false
        type: boolean
      prefix:
        description: Prefix is put before every object name.
        example: telemetry
        type: string
      region:
        example: us-east-1
        type: string
      secretKeyFile:
        type: string
    type: object
  config.SnakeConfig:
    properties:
      ackWait:
        description: |-
          AckWait is how long a consumer of the guaranteed lane, and a durable
          one, waits for a message's acknowledgement before it delivers it again.
          A message sent through a NATS server that died arrives that late. It
          must be longer than OperationTimeout, which bounds the processing of a
          message by a gear: shorter, a slow gear gets each message twice.
        example: 10s
        type: string
      allowNonTLS:
        description: |-
          AllowNonTLS lets a plaintext client connect alongside a TLS one once
          TLSCertFile/TLSKeyFile are set. Mixer-side only: false by default, so
          configuring TLS actually requires it instead of just offering it.
        example: false
        type: boolean
      clientCertFile:
        description: |-
          ClientCertFile and ClientKeyFile are the certificate this client presents
          to NATS. CredentialsFile is a NATS credentials file, with the permissions
          of this client.
        type: string
      clientKeyFile:
        type: string
      clusterName:
        description: |-
          ClusterName is the JetStream domain the embedded server reports. It is
          also what a client uses to reach a domain-scoped server.
        example: flux
        type: string
      connectTimeout:
        example: 10s
        type: string
      consumerMissedHeartbeats:
        description: |-
          ConsumerMissedHeartbeats is how many heartbeats in a row the consumer
          of a subscription may miss before the Rack replaces it, while the
          cluster still lists it or cannot answer. A heartbeat is due every
          operation_timeout. Rack-side only.
        example: 2
        type: integer
      consumerReplicas:
        description: |-
          ConsumerReplicas is the replica count of the consumer behind each
          acknowledged subscription (a guaranteed-lane wire, a scenario push).
          0 takes the stream's replica count, so in a cluster the consumer
          survives the loss or the partition of a Mixer. 1 keeps one replica,
          lighter on the Mixers. Rack-side only.
        example: 0
        type: integer
      convergenceDelay:
        example: 100ms
        type: string
      credentialsFile:
        type: string
      dlqenabled:
        description: |-
          DLQEnabled routes unprocessable messages (decode failure, validation
          failure, or a handler that failed on every redelivery) to the dead
          letter stream instead of dropping them with only a log line. Off keeps
          the previous behavior: log and discard.
        example: true
        type: boolean
      dlqmaxAge:
        description: |-
          DLQMaxAge bounds how long a dead letter is kept. Empty keeps the
          stream default (24h).
        example: 720h
        type: string
      dlqpublishTimeout:
        description: |-
          DLQPublishTimeout bounds how long one dead letter publish waits for the
          server. A dead letter that cannot be written in time is logged and the
          consumer moves on, so a stalled server does not hold it.
        example: 5s
        type: string
      dlqsubject:
        description: DLQSubject is the subject prefix the dead letter stream captures.
        example: flux.dlq
        type: string
      domain:
        example: flux
        type: string
      eventsMaxAge:
        description: |-
          EventsMaxAge and EventsMaxBytes bound the stream of durable events. A
          reader that was down longer than the age has lost what it missed.
          Mixer-side only.
        example: 1h
        type: string
      eventsMaxBytes:
        example: 268435456
        type: integer
      external:
        description: |-
          External means that url names a NATS cluster the operator runs. A Mixer
          starts no embedded server, and several Mixers on one cluster give HA. A
          client verifies the host of the URL and not the domain, on a Mixer and on
          a Rack.
        example: false
        type: boolean
      failoverAfter:
        description: |-
          FailoverAfter is how many JetStream publishes in a row may find no
          stream (a timeout or no responders) before a Rack drops its Mixer and
          reconnects to another one in snake.url. A Mixer cut off from its cluster
          keeps the Rack's connection open while every publish through it fails.
          0 disables it. Rack-side only.
        example: 2
        type: integer
      formTimeout:
        description: |-
          FormTimeout is how long a Mixer on an external NATS waits for it to
          answer, and for a replicated stream to become placeable, before it gives
          up starting. Generous by default: an operator restarting a NATS cluster
          brings its servers up one after another.
        example: 2m
        type: string
      inactiveThreshold:
        example: 30s
        type: string
      initialRetryAttempts:
        example: 10
        type: integer
      initialRetryWait:
        example: 500ms
        type: string
      insecureSkipVerify:
        type: boolean
      kvmaxBytes:
        description: |-
          KVMaxBytes, KVMaxValueSize and KVTTL cap every KV bucket the Mixer
          provisions, the same way StreamMaxAge/StreamMaxBytes cap every stream.
          Mixer-side only.
        example: 1073741824
        type: integer
      kvmaxValueSize:
        example: 1048576
        type: integer
      kvttl:
        example: 0s
        type: string
      maxPingsOut:
        example: 3
        type: integer
      offlineRetryInterval:
        example: 5s
        type: string
      offlineStartTimeout:
        example: 3s
        type: string
      operationTimeout:
        example: 5s
        type: string
      pingInterval:
        description: |-
          PingInterval and MaxPingsOut decide how fast a client of NATS, a Mixer
          or a Rack, notices a server that went silent: after MaxPingsOut
          unanswered pings sent PingInterval apart it reconnects to another
          server. A server that dies without closing its connections (a crash, a
          cut link) is noticed only so, and until then every request on the
          connection times out.
        example: 5s
        type: string
      port:
        example: 4222
        type: integer
      reconnectWait:
        example: 1s
        type: string
      replicas:
        description: |-
          Replicas is how many copies of every stream and bucket the Mixer
          provisions. The embedded server runs alone and holds one, so more than
          1 needs snake.external, on a NATS cluster with at least that many servers.
        example: 1
        type: integer
      rootCAFile:
        type: string
      storeCipher:
        example: chacha
        type: string
      storeDir:
        description: |-
          StoreDir overrides where the embedded Snake keeps its JetStream store.
          Empty keeps the default: a "snake" directory under store.dir.
        example: ./data/snake
        type: string
      storeEncryption:
        example: true
        type: boolean
      storeKeyFile:
        type: string
      storeOldKeyFile:
        type: string
      streamMaxAge:
        example: 24h
        type: string
      streamMaxBytes:
        example: 1073741824
        type: integer
      streamName:
        example: flux-msg
        type: string
      streamSubjects:
        items:
          type: string
        type: array
      subscriptionRetryAttempts:
        example: 5
        type: integer
      subscriptionRetryWait:
        example: 200ms
        type: string
      tlscafile:
        description: |-
          TLSCAFile and TLSVerify enable mTLS: the CA a Rack's own client
          certificate is verified against, and whether presenting one is
          required. Mixer-side only.
        type: string
      tlscertFile:
        type: string
      tlskeyFile:
        type: string
      tlsverify:
        example: false
        type: boolean
      url:
        example: nats://localhost:4222
        type: string
    type: object
  config.StorageConfig:
    properties:
      batchInterval:
        description: |-
          BatchInterval is how often the lease holder commits a batch: it writes
          one file of each kind to s3 or nats, or sends one export to otlp. The
          other Mixers see the telemetry up to the last batch. Each Mixer keeps
          the files it writes or fetches for a query under store.dir/telemetry,
          under the same retention as local files.
        example: 15s
        type: string
      commitTimeout:
        description: |-
          CommitTimeout bounds one upload or export of a batch. A batch that does
          not make it is tried again, and stays unconfirmed until it does.
        example: 30s
        type: string
      nats:
        $ref: '#/definitions/config.NATSStorageConfig'
      otlp:
        $ref: '#/definitions/config.OTLPStorageConfig'
      s3:
        allOf:
        - $ref: '#/definitions/config.S3StorageConfig'
        description: S3, NATS and OTLP configure their type.
      type:
        description: Type is local, s3, nats or otlp.
        example: local
        type: string
    type: object
  config.StoreConfig:
    properties:
      clusterKeyFile:
        example: cluster.key
        type: string
      databaseFile:
        example: flux.duckdb
        type: string
      dir:
        example: ./data
        type: string
      walmaxSizeMB:
        example: 500
        type: integer
    type: object
  config.TelemetryConfig:
    properties:
      baseSubject:
        type: string
      batchInterval:
        type: string
      disabled:
        description: Master switch to disable all telemetry
        type: boolean
      maxBatchSize:
        type: integer
      metrics:
        $ref: '#/definitions/config.MetricsConfig'
      serviceName:
        type: string
      streamName:
        type: string
      streamSubjects:
        items:
          type: string
        type: array
    type: object
  config.ThrottlingConfig:
    properties:
      burst:
        example: 50
        type: integer
      enabled:
        example: true
        type: boolean
      rate:
        example: 500
        type: number
    type: object
  config.WasmConfig:
    properties:
      catalogDir:
        example: ./data/wasm
        type: string
      trustedKeysDir:
        example: ./data/wasm/keys
        type: string
    type: object
  registry.GearSpec:
    properties:
      config:
        additionalProperties:
          type: string
        type: object
      deploy:
        description: string (Group/Rack) or map
        example: rack-group-1
        type: string
      doc:
        example: Primary Ingress
        type: string
      id:
        description: Assigned by Registry/Mixer
        example: "100"
        type: string
      name:
        example: iso8583-in
        type: string
      ports:
        additionalProperties:
          type: string
        description: Assigned by Mixer
        type: object
      type:
        example: iso8583-server
        type: string
    type: object
  registry.LabelMatch:
    properties:
      labels:
        additionalProperties:
          type: string
        type: object
    type: object
  registry.RackTarget:
    properties:
      config:
        additionalProperties: {}
        type: object
      defaults:
        additionalProperties: {}
        type: object
      group:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      match:
        $ref: '#/definitions/registry.LabelMatch'
      name:
        type: string
    type: object
  registry.Scenario:
    properties:
      gears:
        items:
          $ref: '#/definitions/registry.GearSpec'
        type: array
      meta:
        $ref: '#/definitions/registry.ScenarioMeta'
      racks:
        items:
          $ref: '#/definitions/registry.RackTarget'
        type: array
      wires:
        items:
          $ref: '#/definitions/registry.WireSpec'
        type: array
    type: object
  registry.ScenarioMeta:
    properties:
      name:
        example: payment-switch
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  registry.WireSpec:
    properties:
      from:
        example: iso8583-in.out
        type: string
      id:
        description: Assigned by Registry/Mixer
        type: string
      lane:
        description: |-
          Lane is "hot", "guaranteed" or empty. Empty means hot inside one Rack and
          guaranteed between Racks.
        example: guaranteed
        type: string
      to:
        example: router.in
        type: string
    type: object
  sdk.GearCategory:
    enum:
    - io
    - codec
    - logic
    - observability
    type: string
    x-enum-varnames:
    - CategoryIO
    - CategoryCodec
    - CategoryLogic
    - CategoryObservability
  sdk.GearStatus:
    enum:
    - stable
    - roadmap
    type: string
    x-enum-varnames:
    - StatusStable
    - StatusRoadmap
  sdk.Manifest:
    properties:
      category:
        allOf:
        - $ref: '#/definitions/sdk.GearCategory'
        description: Category groups the gear for classification and styling.
      config_schema:
        description: |-
          ConfigSchema is the gear's configuration contract as a JSON Schema
          (draft-07) document. Empty means the gear takes no configuration.
        type: string
      doc_slug:
        description: |-
          DocSlug is the reference-page slug on the public docs site; the full
          URL is derived. Empty means no dedicated page.
        type: string
      ports:
        description: Ports are the input/output ports the gear declares.
        items:
          $ref: '#/definitions/sdk.Port'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/sdk.GearStatus'
        description: Status is the maturity of the gear type.
      summary:
        description: Summary is a one-line description.
        type: string
      terminus:
        allOf:
        - $ref: '#/definitions/sdk.TerminusKind'
        description: |-
          Terminus tells the runtime binding walk how to treat this gear when it
          is the endpoint of a wire path. The zero value (TerminusTransparent)
          means a single-path pass-through, e.g. a codec.
      type:
        description: |-
          Type is the gear type string, matching factory registration
          (e.g. "io_iso8583").
        type: string
    type: object
  sdk.Port:
    properties:
      dir:
        allOf:
        - $ref: '#/definitions/sdk.PortDir'
        description: Dir is the port direction.
      dynamic:
        description: |-
          Dynamic is true when instances are user-named and Name is a pattern
          (e.g. "out_<name>", "out_response_<origin>").
        type: boolean
      name:
        description: |-
          Name is the port name. It may be a concrete name ("in", "out",
          "error") or a pattern for user-named ports ("out_<name>") when Dynamic
          is true. Port names never contain dots (dots separate rack/gear/port in a
          wire endpoint); roles use underscores.
        type: string
      role:
        description: |-
          Role is a free-form role tag for tooling and documentation:
          "request"/"reply"/"response"/"error" on a switch, "ingress"/"egress"
          on an I/O gear (relative to the mesh), or "message" on a plain
          transform/logic data port.
        type: string
      summary:
        description: Summary is a one-line description of the port.
        type: string
    type: object
  sdk.PortDir:
    enum:
    - input
    - output
    type: string
    x-enum-varnames:
    - PortIn
    - PortOut
  sdk.TerminusKind:
    enum:
    - transparent
    - io
    - opaque
    type: string
    x-enum-varnames:
    - TerminusTransparent
    - TerminusIO
    - TerminusOpaque
externalDocs:
  description: fluxrig Architecture Guide
  url: https://fluxrig.org/docs/architecture
host: localhost:8090
info:
  contact:
    email: fluxrig@jaab.tech
    name: JAAB Tech Support
    url: https://fluxrig.org
  description: Control Plane API for fluxrig Orchestration. The Mixer acts as the
    brain of the fleet, managing Rack enrollment, Scenario deployment, and global
    Telemetry aggregation.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: fluxrig Mixer API
  version: 0.0.0-dev
paths:
  /config:
    get:
      description: Returns the current Mixer configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/config.MixerConfig'
      summary: Get Configuration
      tags:
      - core
  /control/sim/{action}:
    post:
      consumes:
      - application/json
      description: Sends a start, stop, rate, or reset command to a named gear and
        waits for it to acknowledge receiving the command. The gear must be running
        on an enrolled Rack and subscribed to its control plane; the response reflects
        delivery, not that the gear finished acting on the command.
      parameters:
      - description: Command
        enum:
        - start
        - stop
        - rate
        - reset
        in: path
        name: action
        required: true
        type: string
      - description: Target gear and, for rate/reset, its arguments
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.SimControlArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid JSON, missing gear, or an unknown action
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: No control-plane connection, or no gear acknowledged the command
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Simulator control
      tags:
      - control
  /entities/stats:
    get:
      description: Returns cached metrics for a specific entity or all entities.
      parameters:
      - description: Entity ID
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get Entity Stats
      tags:
      - telemetry
  /gears:
    get:
      description: 'Returns the manifest catalog: every gear type this build can run,
        with identity, ports, and config schema'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sdk.Manifest'
            type: array
      summary: List gear manifests
      tags:
      - gears
  /gears/{type}:
    get:
      description: Returns the manifest for a single gear type
      parameters:
      - description: Gear type (e.g. io_iso8583)
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sdk.Manifest'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get one gear manifest
      tags:
      - gears
  /health:
    get:
      description: Returns the operational status of the Mixer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Health Check
      tags:
      - core
  /racks:
    get:
      description: Returns a list of all known Racks
      parameters:
      - description: Filter by status (active, pending, offline)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.RackResponse'
            type: array
      summary: List Racks
      tags:
      - registry
  /racks/{id}/{action}:
    post:
      consumes:
      - application/json
      description: 'Perform actions on Racks (Approve, Suspend, Activate, Remove,
        Log-Level). Note: This single endpoint handles multiple actions for simplicity
        in this Alpha version.'
      parameters:
      - description: Rack ID
        in: path
        name: id
        required: true
        type: string
      - description: Action (approve, suspend, activate)
        in: path
        name: action
        type: string
      - description: Approve Request Body
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.ApproveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ActionResponse'
      summary: Rack Actions
      tags:
      - registry
  /scenario/active:
    get:
      description: Returns the currently active scenario as YAML.
      produces:
      - application/yaml
      responses:
        "200":
          description: Scenario YAML
          schema:
            type: string
      summary: Get Active Scenario
      tags:
      - scenario
  /scenario/import:
    post:
      consumes:
      - application/x-yaml
      description: Upload a YAML scenario definition to update the topology.
      parameters:
      - description: Validate without applying
        in: query
        name: dry_run
        type: boolean
      - description: Immediately activate after import
        in: query
        name: activate
        type: boolean
      - description: Scenario YAML
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/registry.Scenario'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ScenarioImportResponse'
        "202":
          description: 'Imported and active, but not yet delivered: no target Rack
            was reachable'
          schema:
            type: string
        "400":
          description: The scenario could not be read or failed validation
          schema:
            type: string
        "409":
          description: 'Imported, but not activated: a gear deploys to a name that
            is not an active Rack'
          schema:
            type: string
        "500":
          description: Imported, but activation failed
          schema:
            type: string
        "503":
          description: 'No Mixer holds the write lease, or the cluster cannot answer
            yet: retry'
          schema:
            type: string
      summary: Import Scenario
      tags:
      - scenario
  /specs:
    get:
      description: Every spec in the content-addressed store, by name, version tag
        and content hash.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.SpecSummary'
            type: array
        "503":
          description: Service Unavailable
          schema:
            type: string
      summary: List stored specs
      tags:
      - specs
    post:
      consumes:
      - application/yaml
      description: 'Validates the artefact for its kind and files it under name:tag.
        A spec declares both; lookup data has no header and needs the name and tag
        query parameters. A translation spec must name store references, and the protocol
        specs and lookup records it names must already be in the store. A name:tag
        that already names other content is refused: change the version.'
      parameters:
      - description: Name to file under. Required for lookup data; overrides a spec's
          declared id.
        in: query
        name: name
        type: string
      - description: Version tag (e.g. v1). Required for lookup data; overrides a
          spec's declared version.
        in: query
        name: tag
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.SpecUploaded'
        "400":
          description: the artefact does not validate
          schema:
            type: string
        "409":
          description: name:tag already names other content
          schema:
            type: string
        "413":
          description: larger than mixer.max_payload_size or registry.spec_max_size
          schema:
            type: string
        "503":
          description: no Mixer holds the write lease, or the store is unavailable
          schema:
            type: string
      summary: Upload a spec or lookup data
      tags:
      - specs
  /specs/{name}:
    get:
      description: Each version the store holds for this spec, newest first — newest
        meaning the highest version, not the last imported, since a patch to an older
        branch arrives after a newer release.
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.SpecSummary'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
      summary: Every version of one spec
      tags:
      - specs
  /specs/{name}/{tag}:
    get:
      description: The spec document as imported, byte for byte.
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      - description: Version tag, or 'latest'
        in: path
        name: tag
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: the spec document
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Fetch a stored spec
      tags:
      - specs
  /specs/{name}/{tag}/doc:
    get:
      description: 'The messages, what each carries, and what every data element means
        — derived from the spec on each request. Defaults to the public variant, which
        omits fields the spec marks `scope: private`.'
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      - description: Version tag, or 'latest'
        in: path
        name: tag
        required: true
        type: string
      - description: public (default) or complete
        in: query
        name: scope
        type: string
      - description: html (default) or markdown
        in: query
        name: format
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: the rendered reference
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Render a spec's protocol reference
      tags:
      - specs
  /telemetry/{type}:
    get:
      description: Query Logs or Metrics from DuckDB
      parameters:
      - description: Type of telemetry (logs, metrics)
        in: path
        name: type
        required: true
        type: string
      - description: Filter by Entity Name
        in: query
        name: entity
        type: string
      - description: Filter by Level (logs only)
        in: query
        name: min_level
        type: string
      - description: Start time (e.g. 1h, 2023-01-01T00:00:00Z)
        in: query
        name: since
        type: string
      - description: Max records (default 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Query Telemetry
      tags:
      - telemetry
  /topology/list:
    get:
      description: Returns the projected topology with rack and gear details.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List Topology
      tags:
      - topology
  /topology/status:
    get:
      description: Returns synchronization status of the fleet
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TopologyStatusResponse'
      summary: Topology Status
      tags:
      - topology
  /wasm/catalog:
    get:
      description: Returns the Wasm modules of the shared catalog, the same on every
        Mixer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/catalog.WasmMetadata'
            type: array
        "503":
          description: The catalog store on the bus is not available
          schema:
            type: string
      summary: List Wasm Catalog
      tags:
      - wasm
  /wasm/import:
    post:
      consumes:
      - application/octet-stream
      description: Securely imports, validates, and distributes a Wasm payload
      parameters:
      - description: Allow unsigned modules
        in: query
        name: allow_unsigned
        type: boolean
      - description: Wasm binary payload
        in: body
        name: body
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.WasmMetadata'
        "400":
          description: 'The module is refused: no trusted signature, or it fails the
            sandbox'
          schema:
            type: string
        "503":
          description: 'The catalog store on the bus did not take the module: nothing
            was imported'
          schema:
            type: string
      summary: Import Wasm Module
      tags:
      - wasm
  /wasm/keys:
    get:
      description: Returns the vendors of the shared keyring, the same on every Mixer,
        revoked ones included
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/catalog.TrustedKey'
            type: array
        "503":
          description: The keyring store on the bus is not available
          schema:
            type: string
      summary: List trusted Wasm vendors
      tags:
      - wasm
  /wasm/keys/{vendor}:
    delete:
      description: Stops trusting the vendor on every Mixer. The vendor stays in the
        keyring as revoked, so a key file a Mixer still holds does not add it back.
      parameters:
      - description: Vendor name
        in: path
        name: vendor
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid vendor name
          schema:
            type: string
        "503":
          description: The keyring store on the bus is not available
          schema:
            type: string
      summary: Revoke a Wasm vendor
      tags:
      - wasm
    put:
      consumes:
      - application/octet-stream
      description: Adds the vendor's Ed25519 public key (32 raw bytes) to the shared
        keyring, or replaces it. Every Mixer trusts it at its next import.
      parameters:
      - description: 'Vendor name: letters, digits, - and _'
        in: path
        name: vendor
        required: true
        type: string
      - description: Ed25519 public key, 32 bytes
        in: body
        name: body
        required: true
        schema:
          items:
