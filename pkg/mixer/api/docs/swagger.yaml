basePath: /api/v1
definitions:
  api.ActionResponse:
    properties:
      name:
        description: Name of the rack (for import/approve).
        example: rack-01
        type: string
      status:
        description: Status of the action.
        example: activated
        type: string
    type: object
  api.ApproveRequest:
    properties:
      name:
        description: Name to assign to the rack (optional, defaults to current).
        example: rack-prod-01
        type: string
    type: object
  api.HealthResponse:
    properties:
      entity_id:
        description: EntityID is the unique fluxEntityID of this Mixer.
        example: 019de49b-0000-7000-8000-000000000000
        type: string
      machine_id:
        description: MachineID is the persistent machine ID.
        example: 019de49b-0000-7000-8000-000000000000
        type: string
      status:
        description: Status of the service (e.g. "ok").
        example: ok
        type: string
      version:
        description: Version of the service.
        example: 0.1.0
        type: string
    type: object
  api.RackResponse:
    properties:
      config:
        allOf:
        - $ref: '#/definitions/config.RackConfig'
        description: Config (Runtime).
      first_seen:
        description: FirstSeen timestamp.
        example: "2023-10-26T10:00:00Z"
        type: string
      id:
        description: ID is the entity ID of the rack.
        example: "45612378"
        type: string
      ip:
        description: IP address of the Rack.
        example: 192.168.1.50
        type: string
      last_seen:
        description: LastSeen timestamp.
        example: "2023-10-27T10:00:00Z"
        type: string
      machine_id:
        description: MachineID is the physical machine ID.
        example: 019de49b-0000-7000-8000-000000000000
        type: string
      name:
        description: Name of the rack.
        example: rack-01
        type: string
      port:
        description: Port the Rack listens on.
        example: 4222
        type: integer
      stats:
        allOf:
        - $ref: '#/definitions/api.RackStats'
        description: Stats (Transient/Snapshot).
      status:
        description: Status of the rack (active, inactive, pending).
        example: active
        type: string
    type: object
  api.RackStats:
    properties:
      cpu_usage:
        description: CPU usage percentage.
        example: 12.5
        type: number
      load_avg:
        description: Load average (1m).
        example: 0.5
        type: number
      mem_usage:
        description: Memory usage percentage.
        example: 45.2
        type: number
      uptime:
        description: Uptime in seconds.
        example: 3600
        type: integer
    type: object
  api.ScenarioImportResponse:
    properties:
      name:
        description: Name of the imported scenario.
        example: payment-switch-v1
        type: string
      status:
        description: Status of the import.
        example: imported_and_activated
        type: string
    type: object
  api.SpecSummary:
    properties:
      doc:
        description: Doc is where this version's protocol reference is served.
        example: /api/v1/specs/iso8583-v87-ascii/v2.2.0/doc
        type: string
      hash:
        example: 1c8831d23bdd8458feafe6a506c5d3730605b78fd22b5d5c7f1c147043ef71af
        type: string
      imported_at:
        description: ImportedAt is absent for anything filed before the store kept
          dates.
        example: "2026-09-06T18:47:26Z"
        type: string
      latest:
        description: Latest reports whether a reference without a tag resolves here.
        example: true
        type: boolean
      name:
        example: iso8583-v87-ascii
        type: string
      protocol:
        description: |-
          Protocol is what the spec declares it speaks; empty when it declares none
          and relies on the loader's default.
        example: iso8583
        type: string
      size:
        description: Size of the stored document in bytes.
        example: 34441
        type: integer
      tag:
        example: v2.2.0
        type: string
      title:
        description: |-
          Title is the human name the document declares, which is not the reference
          it is filed under.
        example: ISO 8583:1987 (ASCII)
        type: string
      urn:
        example: iso8583-v87-ascii:v2.2.0
        type: string
    type: object
  api.TopologyStatusResponse:
    properties:
      active_scenario:
        description: ActiveScenario is the name of the currently active scenario.
        example: Getting Started
        type: string
      active_ver:
        description: ActiveVer is the currently active scenario version.
        example: v1.2.3
        type: string
      racks_total:
        description: RacksTotal is the total number of registered racks.
        example: 50
        type: integer
      sync_status:
        description: SyncStatus indicates global sync state.
        example: synchronized
        type: string
    type: object
  config.ApiConfig:
    properties:
      port:
        description: Port to listen on.
        example: 8090
        type: integer
      readHeaderTimeout:
        description: ReadHeaderTimeout for the HTTP server.
        example: 3s
        type: string
      tlscertFile:
        description: TLSCertFile path to server certificate.
        example: server.crt
        type: string
      tlskeyFile:
        description: TLSKeyFile path to server key.
        example: server.key
        type: string
    type: object
  config.BaseConfig:
    properties:
      name:
        example: node-01
        type: string
      stateDir:
        example: ./data
        type: string
      stateFile:
        example: rack.flux
        type: string
    type: object
  config.EmbeddedConfig:
    properties:
      flushInterval:
        description: FlushInterval for the embedded stack.
        example: 5s
        type: string
      retentionDays:
        description: RetentionDays for local parquet files.
        example: 30
        type: integer
    type: object
  config.EnrollmentConfig:
    properties:
      autoAdopt:
        description: |-
          AutoAdopt, if true, will automatically mark newly enrolled Racks as 'active'.
          If false (default), new Racks start as 'pending'.
        example: false
        type: boolean
      bootstrapSecret:
        description: |-
          BootstrapSecret is the shared secret used for zero-config enrollment and identity adoption.
          Defaults to 'fluxrig' if not specified.
        example: fluxrig
        type: string
      pushDelay:
        description: PushDelay is the time to wait before pushing state to a newly
          enrolled Rack.
        example: 1s
        type: string
    type: object
  config.IngestConfig:
    properties:
      bufferSize:
        description: BufferSize is the internal channel buffer size (deprecated).
        example: 1024
        type: integer
      flushInterval:
        description: FlushInterval determines how often to flush data to Parquet.
        example: 5s
        type: string
    type: object
  config.LoggingConfig:
    properties:
      compress:
        example: true
        type: boolean
      debug:
        description: Hard-override for debug level
        type: boolean
      filename:
        example: logs/fluxrig.log
        type: string
      level:
        example: info
        type: string
      maxBackups:
        example: 7
        type: integer
      maxSizeMB:
        example: 100
        type: integer
      throttling:
        $ref: '#/definitions/config.ThrottlingConfig'
      trace:
        description: Hard-override for trace level
        type: boolean
    type: object
  config.MetricsConfig:
    properties:
      bentoEnabled:
        type: boolean
      hostEnabled:
        type: boolean
      runtimeEnabled:
        type: boolean
    type: object
  config.MixerConfig:
    properties:
      api:
        $ref: '#/definitions/config.ApiConfig'
      base:
        $ref: '#/definitions/config.BaseConfig'
      enrollment:
        $ref: '#/definitions/config.EnrollmentConfig'
      ingest:
        $ref: '#/definitions/config.IngestConfig'
      logging:
        $ref: '#/definitions/config.LoggingConfig'
      mixer:
        $ref: '#/definitions/config.MixerSettings'
      observability:
        $ref: '#/definitions/config.ObservabilityConfig'
      snake:
        $ref: '#/definitions/config.SnakeConfig'
      store:
        $ref: '#/definitions/config.StoreConfig'
      telemetry:
        $ref: '#/definitions/config.TelemetryConfig'
      wasm:
        $ref: '#/definitions/config.WasmConfig'
    type: object
  config.MixerSettings:
    properties:
      maxHops:
        description: Message Limits
        type: integer
      maxPayloadSize:
        type: integer
      scenarioWaitTimeout:
        description: ScenarioWaitTimeout is the time to wait for a rack to register
          when activating a scenario.
        example: 15s
        type: string
      startupScenario:
        description: StartupScenario reference to the scenario to load on startup.
        type: string
    type: object
  config.ObservabilityConfig:
    properties:
      embedded:
        allOf:
        - $ref: '#/definitions/config.EmbeddedConfig'
        description: Embedded configures the local embedded stack.
      enabled:
        description: Enabled master switch for observability features.
        example: true
        type: boolean
      tier:
        description: Tier selects the backend (embedded or standard).
        example: embedded
        type: string
    type: object
  config.RackConfig:
    properties:
      base:
        $ref: '#/definitions/config.BaseConfig'
      logging:
        $ref: '#/definitions/config.LoggingConfig'
      rack:
        $ref: '#/definitions/config.RackSettings'
      snake:
        $ref: '#/definitions/config.SnakeConfig'
      store:
        $ref: '#/definitions/config.StoreConfig'
      telemetry:
        $ref: '#/definitions/config.TelemetryConfig'
    type: object
  config.RackSettings:
    properties:
      cleanupTimeout:
        type: string
      convergenceTimeout:
        type: string
      drainTimeout:
        description: |-
          DrainTimeout bounds a graceful stop (SIGTERM or shutdown command). It
          must exceed the largest gear ticket TTL so in-flight work can complete
          or time out before the process exits. Default 35s (> a 30s switch TTL).
        type: string
      enrollmentInterval:
        type: string
      enrollmentTimeout:
        type: string
      handshakeInterval:
        type: string
      heartbeatInterval:
        type: string
      ip:
        example: 10.0.0.5
        type: string
      machineID:
        description: 'Runtime only: set via Passport or Mixer assignment'
        type: string
      maxHops:
        type: integer
      maxPayloadSize:
        type: integer
      namePrefix:
        type: string
    type: object
  config.SnakeConfig:
    properties:
      connectTimeout:
        example: 10s
        type: string
      convergenceDelay:
        example: 100ms
        type: string
      domain:
        example: flux
        type: string
      inactiveThreshold:
        example: 30s
        type: string
      insecureSkipVerify:
        type: boolean
      operationTimeout:
        example: 5s
        type: string
      port:
        example: 4222
        type: integer
      reconnectWait:
        example: 1s
        type: string
      rootCAFile:
        type: string
      streamName:
        example: flux-msg
        type: string
      streamSubjects:
        items:
          type: string
        type: array
      subscriptionRetryAttempts:
        example: 5
        type: integer
      subscriptionRetryWait:
        example: 200ms
        type: string
      tlscertFile:
        type: string
      tlskeyFile:
        type: string
      url:
        example: nats://localhost:4222
        type: string
    type: object
  config.StoreConfig:
    properties:
      clusterKeyFile:
        example: cluster.key
        type: string
      databaseFile:
        example: flux.duckdb
        type: string
      dir:
        example: ./data
        type: string
      walmaxSizeMB:
        example: 500
        type: integer
    type: object
  config.TelemetryConfig:
    properties:
      baseSubject:
        type: string
      batchInterval:
        type: string
      disabled:
        description: Master switch to disable all telemetry
        type: boolean
      maxBatchSize:
        type: integer
      metrics:
        $ref: '#/definitions/config.MetricsConfig'
      serviceName:
        type: string
      streamName:
        type: string
      streamSubjects:
        items:
          type: string
        type: array
    type: object
  config.ThrottlingConfig:
    properties:
      burst:
        example: 50
        type: integer
      enabled:
        example: true
        type: boolean
      rate:
        example: 500
        type: number
    type: object
  config.WasmConfig:
    properties:
      catalogDir:
        example: ./data/wasm
        type: string
      trustedKeysDir:
        example: ./data/wasm/keys
        type: string
    type: object
  registry.GearSpec:
    properties:
      config:
        additionalProperties:
          type: string
        type: object
      deploy:
        description: string (Group/Rack) or map
        example: rack-group-1
        type: string
      doc:
        example: Primary Ingress
        type: string
      id:
        description: Assigned by Registry/Mixer
        example: "100"
        type: string
      name:
        example: iso8583-in
        type: string
      ports:
        additionalProperties:
          type: string
        description: Assigned by Mixer
        type: object
      type:
        example: iso8583-server
        type: string
    type: object
  registry.LabelMatch:
    properties:
      labels:
        additionalProperties:
          type: string
        type: object
    type: object
  registry.RackTarget:
    properties:
      config:
        additionalProperties: {}
        type: object
      defaults:
        additionalProperties: {}
        type: object
      group:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      match:
        $ref: '#/definitions/registry.LabelMatch'
      name:
        type: string
    type: object
  registry.Scenario:
    properties:
      gears:
        items:
          $ref: '#/definitions/registry.GearSpec'
        type: array
      meta:
        $ref: '#/definitions/registry.ScenarioMeta'
      racks:
        items:
          $ref: '#/definitions/registry.RackTarget'
        type: array
      wires:
        items:
          $ref: '#/definitions/registry.WireSpec'
        type: array
    type: object
  registry.ScenarioMeta:
    properties:
      name:
        example: payment-switch
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  registry.WireSpec:
    properties:
      from:
        example: iso8583-in.out
        type: string
      id:
        description: Assigned by Registry/Mixer
        type: string
      to:
        example: router.in
        type: string
    type: object
  sdk.GearCategory:
    enum:
    - io
    - codec
    - logic
    - observability
    type: string
    x-enum-varnames:
    - CategoryIO
    - CategoryCodec
    - CategoryLogic
    - CategoryObservability
  sdk.GearStatus:
    enum:
    - stable
    - roadmap
    type: string
    x-enum-varnames:
    - StatusStable
    - StatusRoadmap
  sdk.Manifest:
    properties:
      category:
        allOf:
        - $ref: '#/definitions/sdk.GearCategory'
        description: Category groups the gear for classification and styling.
      config_schema:
        description: |-
          ConfigSchema is the gear's configuration contract as a JSON Schema
          (draft-07) document. Empty means the gear takes no configuration.
        type: string
      doc_slug:
        description: |-
          DocSlug is the reference-page slug on the public docs site; the full
          URL is derived. Empty means no dedicated page.
        type: string
      ports:
        description: Ports are the input/output ports the gear declares.
        items:
          $ref: '#/definitions/sdk.Port'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/sdk.GearStatus'
        description: Status is the maturity of the gear type.
      summary:
        description: Summary is a one-line description.
        type: string
      terminus:
        allOf:
        - $ref: '#/definitions/sdk.TerminusKind'
        description: |-
          Terminus tells the runtime binding walk how to treat this gear when it
          is the endpoint of a wire path. The zero value (TerminusTransparent)
          means a single-path pass-through, e.g. a codec.
      type:
        description: |-
          Type is the gear type string, matching factory registration
          (e.g. "io_iso8583").
        type: string
    type: object
  sdk.Port:
    properties:
      dir:
        allOf:
        - $ref: '#/definitions/sdk.PortDir'
        description: Dir is the port direction.
      dynamic:
        description: |-
          Dynamic is true when instances are user-named and Name is a pattern
          (e.g. "out_<name>", "out_response_<origin>").
        type: boolean
      name:
        description: |-
          Name is the port name. It may be a concrete name ("in", "out",
          "error") or a pattern for user-named ports ("out_<name>") when Dynamic
          is true. Port names never contain dots (dots separate rack/gear/port in a
          wire endpoint); roles use underscores.
        type: string
      role:
        description: |-
          Role is a free-form role tag for tooling and documentation:
          "request"/"reply"/"response"/"error" on a switch, "ingress"/"egress"
          on an I/O gear (relative to the mesh), or "message" on a plain
          transform/logic data port.
        type: string
      summary:
        description: Summary is a one-line description of the port.
        type: string
    type: object
  sdk.PortDir:
    enum:
    - input
    - output
    type: string
    x-enum-varnames:
    - PortIn
    - PortOut
  sdk.TerminusKind:
    enum:
    - transparent
    - io
    - opaque
    type: string
    x-enum-varnames:
    - TerminusTransparent
    - TerminusIO
    - TerminusOpaque
externalDocs:
  description: fluxrig Architecture Guide
  url: https://fluxrig.org/docs/architecture
host: localhost:8090
info:
  contact:
    email: fluxrig@jaab.tech
    name: JAAB Tech Support
    url: https://fluxrig.org
  description: Control Plane API for fluxrig Orchestration. The Mixer acts as the
    brain of the fleet, managing Rack enrollment, Scenario deployment, and global
    Telemetry aggregation.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: fluxrig Mixer API
  version: 0.0.0-dev
paths:
  /config:
    get:
      description: Returns the current Mixer configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/config.MixerConfig'
      summary: Get Configuration
      tags:
      - core
  /entities/stats:
    get:
      description: Returns cached metrics for a specific entity or all entities.
      parameters:
      - description: Entity ID
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get Entity Stats
      tags:
      - telemetry
  /gears:
    get:
      description: 'Returns the manifest catalog: every gear type this build can run,
        with identity, ports, and config schema'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/sdk.Manifest'
            type: array
      summary: List gear manifests
      tags:
      - gears
  /gears/{type}:
    get:
      description: Returns the manifest for a single gear type
      parameters:
      - description: Gear type (e.g. io_iso8583)
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sdk.Manifest'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get one gear manifest
      tags:
      - gears
  /health:
    get:
      description: Returns the operational status of the Mixer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Health Check
      tags:
      - core
  /racks:
    get:
      description: Returns a list of all known Racks
      parameters:
      - description: Filter by status (active, pending, offline)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.RackResponse'
            type: array
      summary: List Racks
      tags:
      - registry
  /racks/{id}/{action}:
    post:
      consumes:
      - application/json
      description: 'Perform actions on Racks (Approve, Suspend, Activate, Remove,
        Log-Level). Note: This single endpoint handles multiple actions for simplicity
        in this Alpha version.'
      parameters:
      - description: Rack ID
        in: path
        name: id
        required: true
        type: string
      - description: Action (approve, suspend, activate)
        in: path
        name: action
        type: string
      - description: Approve Request Body
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.ApproveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ActionResponse'
      summary: Rack Actions
      tags:
      - registry
  /scenario/active:
    get:
      description: Returns the currently active scenario as YAML.
      produces:
      - application/yaml
      responses:
        "200":
          description: Scenario YAML
          schema:
            type: string
      summary: Get Active Scenario
      tags:
      - scenario
  /scenario/import:
    post:
      consumes:
      - application/x-yaml
      description: Upload a YAML scenario definition to update the topology.
      parameters:
      - description: Validate without applying
        in: query
        name: dry_run
        type: boolean
      - description: Immediately activate after import
        in: query
        name: activate
        type: boolean
      - description: Scenario YAML
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/registry.Scenario'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ScenarioImportResponse'
      summary: Import Scenario
      tags:
      - scenario
  /specs:
    get:
      description: Every spec in the content-addressed store, by name, version tag
        and content hash.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.SpecSummary'
            type: array
        "503":
          description: Service Unavailable
          schema:
            type: string
      summary: List stored specs
      tags:
      - specs
  /specs/{name}:
    get:
      description: Each version the store holds for this spec, newest first — newest
        meaning the highest version, not the last imported, since a patch to an older
        branch arrives after a newer release.
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.SpecSummary'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
      summary: Every version of one spec
      tags:
      - specs
  /specs/{name}/{tag}:
    get:
      description: The spec document as imported, byte for byte.
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      - description: Version tag, or 'latest'
        in: path
        name: tag
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: the spec document
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Fetch a stored spec
      tags:
      - specs
  /specs/{name}/{tag}/doc:
    get:
      description: 'The messages, what each carries, and what every data element means
        — derived from the spec on each request. Defaults to the public variant, which
        omits fields the spec marks `scope: private`.'
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      - description: Version tag, or 'latest'
        in: path
        name: tag
        required: true
        type: string
      - description: public (default) or complete
        in: query
        name: scope
        type: string
      - description: html (default) or markdown
        in: query
        name: format
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: the rendered reference
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Render a spec's protocol reference
      tags:
      - specs
  /telemetry/{type}:
    get:
      description: Query Logs or Metrics from DuckDB
      parameters:
      - description: Type of telemetry (logs, metrics)
        in: path
        name: type
