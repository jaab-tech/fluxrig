[logging]
level = "trace"
filename = "logs/mixer.log"

[store]
dir = "./data"
wal_max_size_mb = 500
database_file = "fluxrig.duckdb"
cluster_key_file = "cluster.key"

[mixer]
machine_id = 1
mixer_name = "e2e-mixer"

[api]
port = 9110

[snake]
port = 4223
url = "nats://127.0.0.1:4223"
cluster_name = "e2e-cluster"

[observability]
enabled = true
tier = "embedded"

[observability.embedded]
flush_interval = "2s"

[enrollment]
auto_adopt = true
