meta:
  version: "1.0.0"

racks:
  - name: "comp-node-01"
    labels:
      tier: "edge"

gears:
  - name: "gateway"
    type: "io_tcp"
    deploy: "comp-node-01" # Target the Rack Name
    config:
      mode: "server"
      bind: ":9001"
      delimiter: "\n"
      delimiter_append: true
      tags:
        role: "ingress"

wires:
  # Loopback Echo: Gateway out -> Gateway in
  - from: "gateway.out"
    to: "gateway.in"
