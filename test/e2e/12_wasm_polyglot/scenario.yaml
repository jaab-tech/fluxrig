meta:
  name: "Wasm Polyglot Demo"
  version: "1.0.0"

gears:
  - name: my-wasm-gear
    type: wasm
    config:
      # A placeholder, not a path. The suite replaces it with the catalog
      # URN once the module is imported and hashed, and a literal path here
      # made one developer's home directory load-bearing in a test.
      source: "file://WASM_MODULE_PATH"
      entrypoint: "process"
      memory_limit_pages: 16

  - name: test-in
    type: bento
    config:
      ports:
        outputs: ["out"]
      bento:
        input:
          generate:
            mapping: |
              root = {"hello": "wasm"}
            count: 1

  - name: test-out
    type: bento
    config:
      ports:
        inputs: ["in"]
      bento:
        output:
          stdout: {}

wires:
  - from: "test-in.out"
    to: "my-wasm-gear.in"
  
  - from: "my-wasm-gear.out"
    to: "test-out.in"
