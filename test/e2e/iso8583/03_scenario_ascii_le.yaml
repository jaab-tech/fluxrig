meta:
  name: "iso8583_ascii_le"
  version: "1.0.0"

racks:
  - name: "iso-node-01"
    labels:
      tier: "edge"

gears:
  - name: "iso-gateway"
    type: "io_iso8583"
    deploy: "iso-node-01"
    config:
      mode: "server"
      bind: ":8583"
      header_length_bytes: 2
      header_endian: "little"
      encoding: "ascii"

  - name: "iso-client"
    type: "io_iso8583"
    deploy: "iso-node-01"
    config:
      mode: "client"
      connect: "127.0.0.1:10000"
      header_length_bytes: 2
      header_endian: "little"
      encoding: "ascii"
      reconnect_wait: "1s"

wires:
  # Route Server Ingress -> Client Egress
  - from: "iso-gateway.out"
    to: "iso-client.in"

  # Route Client Response -> Server Egress
  - from: "iso-client.out"
    to: "iso-gateway.in"
