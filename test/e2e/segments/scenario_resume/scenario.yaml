meta:
  name: "resume_test"
  version: "1.0.0"

racks:
  - name: "rack-resume"

gears:
  # A TCP server: while its port is listening, the scenario is running.
  - name: "gateway"
    type: "io_tcp"
    deploy: "rack-resume"
    config:
      mode: "server"
      bind: ":9611"
      delimiter: "\n"
      delimiter_append: true

wires:
  - from: "gateway.out"
    to: "gateway.in"
