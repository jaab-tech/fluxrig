[logging]
level = "debug"
filename = "logs/mixer.log"

[api]
port = 8102
tls_cert_file = "../certs/server.crt"
tls_key_file = "../certs/server.key"

[snake]
port = 4302
url = "nats://localhost:4302"
tls_cert_file = "../certs/server.crt"
tls_key_file = "../certs/server.key"
root_ca_file = "../certs/ca.crt"

[store]
dir = "./data"
database_file = "flux.duckdb"
cluster_key_file = "cluster.key"

[enrollment]
auto_adopt = true
