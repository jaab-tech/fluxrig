meta:
  name: "bento_load_smoke_test"
  version: "1.0.0"

racks:
  - name: "load-node-01"
    labels:
      tier: "test"

gears:
  - name: "bento-gen"
    type: "bento"
    deploy: "load-node-01"
    config:
      log_level: "INFO"
      ports:
        outputs: ["out"]
      bento:
        input:
          generate:
            interval: "1s"
            count: 5
            mapping: |
              root.id = count("messages")
              root.ts = timestamp_unix_nano()
              root.payload = "smoke_test_data_" + count("messages").string()
        # Output auto-wired via port "out"

  - name: "bento-sink"
    type: "bento"
    deploy: "load-node-01"
    config:
      log_level: "TRACE"
      ports:
        inputs: ["in"]
      bento:
        # Input auto-wired via port "in"
        output:
          file:
            path: "/tmp/flux_e2e_load_out.txt"
            codec: lines

wires:
  - from: "bento-gen.out"
    to: "bento-sink.in"
