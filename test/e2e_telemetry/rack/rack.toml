[store]
dir = "./data"
state_file = "state.flux"

[rack]
name = "rack-e2e-telemetry-01"
# data_dir removed

[rack.bus]
url = "nats://localhost:4225"

[logging]
level = "debug"
filename = "logs/rack.log" # Json or Text? Format is json below..
log_type = "json"

[telemetry]
service_name = "flux-rack-e2e"
export_type = "nats"
export_interval = "100ms" # Very fast flush for test
batch_size = 1
