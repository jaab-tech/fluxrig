[logging]
level = "info"
filename = "logs/mixer.log"

[api]
port = 8090

[store]
dir = "data"
database_file = "fluxrig.duckdb"
cluster_key_file = "cluster.key"

[snake]
port = 4222
url = "nats://localhost:4222"
cluster_name = "flux"
stream_name = "flux-msg"
stream_subjects = ["flux.msg.>", "flux.agent.>", "flux.rack.>", "flux.ctrl.>"]

[enrollment]
auto_adopt = true
