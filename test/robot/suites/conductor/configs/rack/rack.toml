#
# The rack name MUST equal the scenario's deploy target ("rack-switch"), or the
# switch gears are skipped at ApplyScenario.
[rack]
name = "rack-switch"
enrollment_timeout = "10s"

[snake]
url = "nats://localhost:4222"
domain = "flux"
stream_name = "flux-msg"
# Below the conn-events scenarios' max_event_age of 8s, and above the 5s
# operation_timeout default: a redelivery still lands inside the tests' age
# window, and the max_event_age > ack_wait validation passes.
ack_wait = "6s"

[logging]
level = "info"
filename = "logs/fluxrig.log"
max_size_mb = 100
max_backups = 3
compress = false

