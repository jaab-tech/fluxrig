# The second Rack of the two Rack suite. The first one is the conductor's.
[rack]
name = "rack-b"
enrollment_timeout = "10s"

[snake]
url = "nats://localhost:4222"
domain = "flux"
stream_name = "flux-msg"
# Same as the first Rack: below the scenarios' 8s max_event_age, above the
# 5s operation_timeout default.
ack_wait = "6s"

[logging]
level = "info"
filename = "logs/fluxrig.log"
max_size_mb = 100
max_backups = 3
compress = false

