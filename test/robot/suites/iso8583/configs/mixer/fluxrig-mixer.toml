[logging]
level = "debug"
filename = "logs/mixer.log"

[api]
port = 8090

[store]
dir = "data"
database_file = "fluxrig.duckdb"
cluster_key_file = "cluster.key"

[snake]
port = 4222
url = "nats://localhost:4222"
cluster_name = "flux"
store_dir = "data/js"
stream_name = "flux-msg"
stream_subjects = ["fluxrig.>", "flux.msg.>"]

[observability]
enabled = true
tier = "embedded"

[enrollment]
auto_adopt = true
