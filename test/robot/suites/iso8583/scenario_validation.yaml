meta:
  name: "iso8583_validation"
  version: "1.0.0"

racks:
  - name: "iso-node-01"
    labels:
      tier: "edge"

gears:
  - name: "iso-gateway"
    type: "io_iso8583"
    deploy: "iso-node-01"
    config:
      mode: "server"
      bind: ":8583"
      frame_length_size: 2
      frame_length_endian: "big"
      encoding: "bcd"
      preserve_headers: true
      strict_connection_routing: false

  - name: "iso-client"
    type: "io_iso8583"
    deploy: "iso-node-01"
    config:
      mode: "client"
      connect: "127.0.0.1:8590"
      frame_length_size: 2
      frame_length_endian: "big"
      encoding: "bcd"
      preserve_headers: true
      reconnect_wait: "1s"

wires:
  # Route Server Ingress -> Client Egress (One Way)
  - from: "iso-gateway.out"
    to: "iso-client.in"

  # Route Client Response -> Server Egress
  - from: "iso-client.out"
    to: "iso-gateway.in"
