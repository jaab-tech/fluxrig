# Copyright 2026 JAAB Tech SAS, Uruguay
#
# ISO 8583 spec exercising a BER-TLV composite (DE 55, EMV ICC data).
#
# DE 55 declares three EMV tags. Any other tag arriving inside it is unknown to
# this spec and must survive a decode/encode cycle untouched, which is what a
# switch forwarding to a scheme depends on. The declared set is deliberately
# incomplete: real chip data carries far more tags than any switch models.
spec:
  id: robot-tlv
  name: robot_tlv
  version: 1.0.0
  wire:
    format: moov
    fields:
      0:
        type: String
        length: 4
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: MTI
      1:
        type: Bitmap
        length: 8
        enc: Binary
        prefix: Binary.Fixed
        description: Bitmap
      2:
        type: String
        length: 19
        enc: ASCII
        prefix: ASCII.LL
        padding:
          pad: "0"
          type: Left
        description: PAN
      3:
        type: String
        length: 6
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: Processing Code
      4:
        type: String
        length: 12
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: Amount
      11:
        type: String
        length: 6
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: STAN
      39:
        type: String
        length: 2
        enc: ASCII
        prefix: ASCII.Fixed
        description: Response Code
      41:
        type: String
        length: 8
        enc: ASCII
        prefix: ASCII.Fixed
        description: Terminal ID
      55:
        type: Composite
        length: 999
        prefix: ASCII.LLL
        description: ICC Data
        tag:
          enc: BerTLVTag
          prefUnknownTLV: BerTLV
          skipUnknownTLVTags: true
          sort: StringsByHex
          storeUnknownTLVTags: true
        subfields:
          5F2A:
            description: Transaction Currency Code
            enc: Binary
            prefix: BerTLV
            type: Binary
          9F02:
            description: Amount, Authorized
            enc: Binary
            prefix: BerTLV
            type: Binary
          9F36:
            description: Application Transaction Counter
            enc: Binary
            prefix: BerTLV
            type: Binary
          "82":
            description: Application Interchange Profile
            enc: Binary
            prefix: BerTLV
            type: Binary
  fields:
    0:
      name: MTI
    1:
      name: Bitmap
    2:
      name: PAN
      alias: card.pan
      log_mask: true
    3:
      name: Processing Code
    4:
      name: Amount
    11:
      name: STAN
      alias: stan
    39:
      name: Response Code
      alias: response_code
    41:
      name: Terminal ID
      alias: terminal_id
    55:
      name: ICC Data
      alias: icc_data
      subfields:
        layout: tlv
        parts:
          - name: Transaction Currency Code
            tag: 5F2A
          - name: Application Interchange Profile
            tag: "82"
          - name: Amount, Authorized
            tag: 9F02
          - name: Application Transaction Counter
            tag: 9F36
