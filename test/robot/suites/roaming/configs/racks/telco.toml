#
# The rack name MUST equal the scenario's deploy target, or those gears are
# skipped at ApplyScenario without saying so.
[rack]
name = "rack-telco"
machine_id = 121
enrollment_timeout = "10s"

[bus]
url = "nats://localhost:4222"
domain = "flux"
stream_name = "flux-msg"

[logging]
level = "info"
filename = "logs/fluxrig.log"
max_size_mb = 100
max_backups = 3
compress = false

[enrollment]
timeout = "10s"
push_delay = "100ms"
