#
# The dialect spoken towards the issuer's authorizer. Identical to the scheme
# dialect except for DE 48, the private field the enrichment outcome rides in.
# That one field is the whole difference between the two specs, which is why the
# reply needs no re-encoding: by the time it comes back, the field has been read
# and the bytes are already what the scheme expects.
spec:
  id: roaming-issuer
  name: roaming_issuer
  version: 1.0.0
  wire:
    format: moov
    fields:
      0:
        type: String
        length: 4
        enc: ASCII
        prefix: ASCII.Fixed
        description: MTI
      1:
        type: Bitmap
        length: 8
        enc: Binary
        prefix: Binary.Fixed
        description: Bitmap
      2:
        type: String
        length: 19
        enc: ASCII
        prefix: ASCII.LL
        padding:
          pad: "0"
          type: Left
        description: PAN
      3:
        type: String
        length: 6
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: Processing Code
      4:
        type: String
        length: 12
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: Amount
      7:
        type: String
        length: 10
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: Transmission Date & Time
      11:
        type: String
        length: 6
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: STAN
      18:
        type: String
        length: 4
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: Merchant Category Code
      22:
        type: String
        length: 3
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: POS Entry Mode
      39:
        type: String
        length: 2
        enc: ASCII
        prefix: ASCII.Fixed
        description: Response Code
      41:
        type: String
        length: 8
        enc: ASCII
        prefix: ASCII.Fixed
        description: Card Acceptor Terminal ID
      42:
        type: String
        length: 15
        enc: ASCII
        prefix: ASCII.Fixed
        description: Card Acceptor ID
      43:
        type: String
        length: 40
        enc: ASCII
        prefix: ASCII.Fixed
        description: Card Acceptor Name/Location
      48:
        type: String
        length: 999
        enc: ASCII
        prefix: ASCII.LLL
        description: Additional Data - Private
      49:
        type: String
        length: 3
        enc: ASCII
        prefix: ASCII.Fixed
        padding:
          pad: "0"
          type: Left
        description: Currency Code
  fields:
    0:
      name: MTI
    1:
      name: Bitmap
    2:
      name: PAN
      alias: card.pan
      log_mask: true
    3:
      name: Processing Code
    4:
      name: Amount
    7:
      name: Transmission Date & Time
    11:
      name: STAN
      alias: stan
    18:
      name: Merchant Category Code
    22:
      name: POS Entry Mode
    39:
      name: Response Code
    41:
      name: Card Acceptor Terminal ID
    42:
      name: Card Acceptor ID
    43:
      name: Card Acceptor Name/Location
    48:
      name: Additional Data - Private
      alias: risk.roaming_code
    49:
      name: Currency Code
