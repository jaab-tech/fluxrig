# Topology Scenario for Cross-Rack Testing
meta:
  name: "cross_rack_topology"
  version: "1.0.0"

racks:
  - name: "rack-a-adopted"
    labels:
      role: "primary"
  - name: "rack-b"
    labels:
      role: "secondary"

gears:
  - name: "bento-gen"
    type: "bento"
    deploy: "rack-a-adopted"
    config:
      log_level: "INFO"
      ports:
        outputs: ["out"]
      bento:
        input:
          generate:
            interval: "100ms"
            count: 50
            mapping: |
              root.id = count("messages")
              root.ts = timestamp_unix_nano()
              root.payload = "phase1_test_" + count("messages").string()
        # Output auto-wired via port "out"

  - name: "blackhole"
    type: "bento"
    deploy: "rack-b"
    config:
      log_level: "TRACE"
      ports:
        inputs: ["in"]
      bento:
        # Input auto-wired via port "in"
        pipeline:
          processors:
            - log:
                level: INFO
                message: "phase1_test received: ${! content() }"
        output:
          drop: {}

wires:
  - from: "bento-gen.out"
    to: "blackhole.in"
